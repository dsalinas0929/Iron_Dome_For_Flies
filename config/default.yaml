camera:
  source: 0
  width: 1280
  height: 720
  fps_target: 20

detection:
  model_path: yolov8n.pt
  min_confidence: 0.6

tracking:
  smooth_factor: 0.5
  lock_frames_required: 3

servo:
  enabled: false
  driver: pca9685
  i2c_bus: 1
  i2c_address: 64
  pwm_frequency_hz: 50
  pan_channel: 0
  tilt_channel: 1
  pan_min_deg: 10.0
  pan_max_deg: 170.0
  tilt_min_deg: 5.0
  tilt_max_deg: 70.0
  pan_invert: false
  tilt_invert: false
  pan_offset_deg: 0.0
  tilt_offset_deg: 0.0
  servo_min_pulse_us: 500.0
  servo_max_pulse_us: 2500.0
  deadband_deg: 0.2
  startup_center: false

safety:
  pan_min: 10
  pan_max: 170
  tilt_min: 5
  tilt_max: 70
  min_confidence_to_fire: 0.6

laser:
  gpio_pin: 18
  enabled: false
